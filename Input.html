<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Input</title>

    <!-- LINK TO CSS -->
    <link rel="stylesheet" href="Styles/style.css">

    <style>
        main {
            padding: 20px;
        }

        form {
            max-width: 400px;
            margin: auto;
        }

        fieldset {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1 style="text-align:center; color:#2E86AB;">Shape Area Calculator</h1>
    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<main>
    <h2>Enter Shape Dimensions</h2>

    <form action="result.html" method="GET" id="shapeForm">

        <!-- Shape Selection -->
        <fieldset>
            <legend>Select a Shape</legend>

            <input type="radio" id="rectangle" name="shape" value="rectangle" required>
            <label for="rectangle">Rectangle</label><br>

            <input type="radio" id="circle" name="shape" value="circle">
            <label for="circle">Circle</label><br>

            <input type="radio" id="triangle" name="shape" value="triangle">
            <label for="triangle">Triangle</label>
        </fieldset>

        <!-- Rectangle Inputs -->
        <label for="width">Width:</label>
        <input type="number" id="width" name="width" min="1"><br><br>

        <label for="height">Height:</label>
        <input type="number" id="height" name="height" min="1"><br><br>

        <!-- Circle Input -->
        <label for="radius">Radius:</label>
        <input type="number" id="radius" name="radius" min="1"><br><br>

        <!-- Triangle Inputs -->
        <label for="base">Base:</label>
        <input type="number" id="base" name="base" min="1"><br><br>

        <label for="triHeight">Triangle Height:</label>
        <input type="number" id="triHeight" name="triHeight" min="1"><br><br>

        <button type="submit">Calculate Area</button>
    </form>
</main>

<footer>
    <p>Shape App</p>
</footer>
    <script src="Scripts/site.js"></script>

</body>
</html>
